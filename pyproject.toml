[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redforge"
version = "1.0.0"
description = "Automated LLM red-team harness + layered prompt-injection defense"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
  "pytest>=8",
  "httpx>=0.27",
  "pyyaml>=6",
  "numpy>=1.26",
]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.25"]
langfuse = ["langfuse>=2.0"]

